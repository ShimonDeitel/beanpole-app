name: Beanpole
options:
  bundleIdPrefix: com.shimondeitel.beanpole
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Beanpole:
    type: application
    platform: iOS
    sources:
      - path: Beanpole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.beanpole
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Beanpole/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  BeanpoleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeanpoleTests
      - path: Beanpole.storekit
    dependencies:
      - target: Beanpole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.beanpole.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  BeanpoleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BeanpoleUITests
    dependencies:
      - target: Beanpole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.beanpole.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Beanpole:
    build:
      targets:
        Beanpole: all
        BeanpoleTests: [test]
        BeanpoleUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Beanpole.storekit
    test:
      config: Debug
      storeKitConfiguration: Beanpole.storekit
      targets:
        - BeanpoleTests
        - BeanpoleUITests
    archive:
      config: Release
